<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imtiaz ❤️ Mim</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff4d6d,#ff758f,#ffb3c6);
}

.container{
    text-align:center;
    color:white;
    z-index:2;
    animation:fadeIn 2s;
}

h1{
    font-size:4rem;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

h2{
    margin-top:15px;
    font-size:2rem;
}

p{
    margin-top:20px;
    font-size:1.3rem;
    opacity:.95;
}

.heart{
    color:#fff;
    animation:beat 1s infinite;
    display:inline-block;
}

button{
    margin-top:35px;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    background:white;
    color:#ff3366;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px white;
}

.message{
    margin-top:25px;
    font-size:1.4rem;
    font-weight:bold;
    min-height:40px;
}

/* Floating Hearts */
.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.hearts span{
    position:absolute;
    bottom:-50px;
    color:rgba(255,255,255,.7);
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(2);
        opacity:0;
    }
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.3);}
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="container">
    <h1>Imtiaz <span class="heart">❤️</span> Mim</h1>
    <h2>Forever & Always</h2>

    <p>
        Every heartbeat whispers one name... <br>
        <b>Mim.</b>
    </p>

    <button onclick="showLove()">
        Click Here ❤️
    </button>

    <div class="message" id="msg"></div>
</div>

<script>
const messages = [
"❤️ Imtiaz Loves Mim ❤️",
"🌹 You make every day beautiful.",
"💖 My heart smiles when I think of you.",
"✨ Every love story is beautiful, but ours is my favorite.",
"🥰 Forever isn't long enough with you.",
"🌸 You are the sweetest part of my life."
];

function showLove(){
    const random = messages[Math.floor(Math.random()*messages.length)];
    document.getElementById("msg").innerHTML = random;
}

// Floating Hearts
const hearts = document.getElementById("hearts");

setInterval(()=>{
    const heart = document.createElement("span");
    heart.innerHTML = "❤";
    heart.style.left = Math.random()*100+"%";
    heart.style.fontSize = (20+Math.random()*40)+"px";
    heart.style.animationDuration = (5+Math.random()*5)+"s";
    hearts.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
},300);
</script>

</body>
</html>
